<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Oracle Knowledge Galaxy</title>
<style>
*{margin:0;padding:0}body{background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace}
canvas{display:block}
#info{position:fixed;top:20px;left:20px;color:#00f0ff;font-size:14px;text-shadow:0 0 10px rgba(0,240,255,0.5);z-index:10}
#info h1{font-size:20px;margin-bottom:5px}
#info .stats{color:#555;font-size:11px}
#tooltip{position:fixed;display:none;background:rgba(10,14,23,0.95);border:1px solid #00f0ff;border-radius:8px;padding:10px 14px;color:#e0e0e0;font-size:11px;max-width:300px;box-shadow:0 0 20px rgba(0,240,255,0.2);pointer-events:none;z-index:20}
#tooltip .t{color:#00f0ff;font-weight:700;margin-bottom:4px}
#tooltip .c{color:#888;font-size:10px}
</style></head><body>
<div id="info"><h1>Oracle Knowledge Galaxy</h1><div class="stats" id="stats">Loading...</div></div>
<div id="tooltip"><div class="t"></div><div class="c"></div></div>
<canvas id="c"></canvas>
<script>
const COLORS={deploy:'#ff6b6b',testing:'#ffa726',security:'#ff4444',social:'#42a5f5',automation:'#66bb6a',workflow:'#ab47bc',database:'#ffca28',consciousness:'#00f0ff',communication:'#e91e63',cloudflare:'#ff9800',other:'#8888aa'};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,stars=[],dust=[],nebulas=[],labels=[],mouse={x:-999,y:-999},hovered=null,angle=0;

function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});

async function load(){
  const res=await fetch('/stars-data').catch(()=>fetch('/graph.json'));
  const data=await res.json();
  const nodes=data.nodes;

  // Category clusters — tighter, galaxy-like
  const cats=[...new Set(nodes.map(n=>n.category))];
  const catPos={};
  cats.forEach((c,i)=>{
    const a=i/cats.length*Math.PI*2-Math.PI/2;
    const r=Math.min(W,H)*0.15;
    catPos[c]={x:Math.cos(a)*r,y:Math.sin(a)*r,color:COLORS[c]||'#888'};
  });

  // Main stars (149 learnings)
  nodes.forEach((n,i)=>{
    const cp=catPos[n.category]||{x:0,y:0,color:'#888'};
    const spread=40+Math.random()*80;
    const a=Math.random()*Math.PI*2;
    stars.push({
      x:cp.x+Math.cos(a)*spread*(0.5+Math.random()),
      y:cp.y+Math.sin(a)*spread*(0.5+Math.random()),
      z:(Math.random()-0.5)*100,
      size:1+Math.random()*2+(n.tags?.length||0)*0.3,
      color:COLORS[n.category]||'#888',
      pulse:Math.random()*Math.PI*2,
      name:n.name,
      category:n.category,
      tags:n.tags||[],
    });
  });

  // Dust particles (8000+ tiny stars — creates nebula density)
  for(let i=0;i<8000;i++){
    const cat=cats[Math.floor(Math.random()*cats.length)];
    const cp=catPos[cat];
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*220;
    dust.push({
      x:cp.x+Math.cos(a)*r,
      y:cp.y+Math.sin(a)*r,
      z:(Math.random()-0.5)*60,
      size:0.3+Math.random()*1.2,
      color:cp.color,
      alpha:0.2+Math.random()*0.6,
    });
  }

  // Background dust (scattered)
  for(let i=0;i<1000;i++){
    dust.push({
      x:(Math.random()-0.5)*W*1.5,
      y:(Math.random()-0.5)*H*1.5,
      z:(Math.random()-0.5)*200,
      size:0.2+Math.random()*0.5,
      color:'#ffffff',
      alpha:0.1+Math.random()*0.3,
    });
  }

  // Nebula clouds (large colored circles)
  cats.forEach(c=>{
    const cp=catPos[c];
    for(let i=0;i<8;i++){
      nebulas.push({
        x:cp.x+(Math.random()-0.5)*180,
        y:cp.y+(Math.random()-0.5)*180,
        r:80+Math.random()*150,
        color:cp.color,
        alpha:0.04+Math.random()*0.06,
      });
    }
  });
  // Extra center nebula
  for(let i=0;i<10;i++){
    const c=cats[Math.floor(Math.random()*cats.length)];
    nebulas.push({x:(Math.random()-0.5)*100,y:(Math.random()-0.5)*100,r:100+Math.random()*200,color:COLORS[c],alpha:0.02+Math.random()*0.03});
  }

  // Labels
  cats.forEach(c=>{
    const cp=catPos[c];
    labels.push({x:cp.x,y:cp.y+10,text:c.toUpperCase(),color:cp.color});
  });

  document.getElementById('stats').textContent=`${stars.length} learnings · ${dust.length} particles · ${cats.length} domains`;
}

function project(x,y,z){
  const cos=Math.cos(angle),sin=Math.sin(angle);
  const rx=x*cos-z*sin;
  const rz=x*sin+z*cos;
  const scale=800/(800+rz);
  return{sx:W/2+rx*scale,sy:H/2+y*scale,scale};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  angle+=0.0008;

  // Nebula clouds
  for(const n of nebulas){
    const p=project(n.x,n.y,0);
    const grad=ctx.createRadialGradient(p.sx,p.sy,0,p.sx,p.sy,n.r*p.scale);
    grad.addColorStop(0,n.color+Math.floor(n.alpha*255).toString(16).padStart(2,'0'));
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,n.r*p.scale,0,Math.PI*2);
    ctx.fill();
  }

  // Dust
  for(const d of dust){
    const p=project(d.x,d.y,d.z);
    const s=d.size*p.scale;
    ctx.globalAlpha=d.alpha*p.scale;
    ctx.fillStyle=d.color;
    ctx.fillRect(p.sx,p.sy,s,s);
  }
  ctx.globalAlpha=1;

  // Stars
  hovered=null;
  let minDist=25;
  const projected=stars.map(s=>{
    const p=project(s.x,s.y,s.z);
    return{...p,star:s};
  });

  // Check hover
  for(const p of projected){
    const dx=mouse.x-p.sx,dy=mouse.y-p.sy;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<minDist){minDist=d;hovered=p;}
  }

  for(const p of projected){
    const s=p.star;
    s.pulse+=0.015;
    const pulse=1+Math.sin(s.pulse)*0.3;
    const r=s.size*p.scale*pulse;
    const isH=hovered===p;

    // Glow
    ctx.save();
    ctx.shadowColor=s.color;
    ctx.shadowBlur=isH?30:15;
    ctx.fillStyle=s.color;
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,isH?r*1.5:r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Bright core
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,(isH?r*0.5:r*0.25),0,Math.PI*2);
    ctx.fill();
  }

  // Labels
  ctx.font='11px JetBrains Mono,monospace';
  ctx.textAlign='center';
  for(const l of labels){
    const p=project(l.x,l.y,0);
    ctx.fillStyle=l.color+'60';
    ctx.fillText(l.text,p.sx,p.sy);
  }

  // Tooltip
  const tip=document.getElementById('tooltip');
  if(hovered){
    const s=hovered.star;
    tip.style.display='block';
    tip.style.left=(mouse.x+15)+'px';
    tip.style.top=(mouse.y-10)+'px';
    tip.querySelector('.t').textContent=s.name;
    tip.querySelector('.c').textContent=s.category+' · '+(s.tags||[]).join(', ');
  }else{tip.style.display='none';}

  requestAnimationFrame(draw);
}

load().then(draw);
</script></body></html>
