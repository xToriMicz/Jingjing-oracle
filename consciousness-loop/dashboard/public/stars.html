<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Oracle Knowledge Galaxy</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
  canvas { display: block; }
  #info {
    position: fixed; top: 20px; left: 20px; color: #00f0ff;
    font-size: 14px; text-shadow: 0 0 10px rgba(0,240,255,0.5);
  }
  #info h1 { font-size: 20px; margin-bottom: 5px; }
  #info .stats { color: #555; font-size: 11px; }
  #tooltip {
    position: fixed; display: none; background: rgba(10,14,23,0.95);
    border: 1px solid #00f0ff; border-radius: 8px; padding: 10px 14px;
    color: #e0e0e0; font-size: 11px; max-width: 300px;
    box-shadow: 0 0 20px rgba(0,240,255,0.2); pointer-events: none;
  }
  #tooltip .title { color: #00f0ff; font-weight: 700; margin-bottom: 4px; }
  #tooltip .cat { color: #888; font-size: 10px; }
  #tooltip .tags { color: #666; font-size: 10px; margin-top: 4px; }
  #legend {
    position: fixed; bottom: 20px; left: 20px; color: #555; font-size: 10px;
  }
  #legend span { margin-right: 12px; }
  #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<div id="info">
  <h1>Oracle Knowledge Galaxy</h1>
  <div class="stats" id="stats">Loading...</div>
</div>
<div id="tooltip"><div class="title"></div><div class="cat"></div><div class="tags"></div></div>
<div id="legend"></div>
<canvas id="c"></canvas>

<script>
const COLORS = {
  deploy: '#ff6b6b', testing: '#ffa726', security: '#ff4444',
  social: '#42a5f5', automation: '#66bb6a', workflow: '#ab47bc',
  database: '#ffca28', consciousness: '#00f0ff', communication: '#e91e63',
  cloudflare: '#ff9800', other: '#555'
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, nodes = [], edges = [], mouse = {x: -999, y: -999}, hovered = null;
let angle = 0, zoom = 1;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('wheel', e => { zoom = Math.max(0.3, Math.min(3, zoom - e.deltaY * 0.001)); });

async function load() {
  const res = await fetch('/stars-data');
  let data;
  try { data = await res.json(); } catch {
    const res2 = await fetch('/graph.json');
    data = await res2.json();
  }

  nodes = data.nodes.map((n, i) => {
    // Spiral galaxy layout
    const a = i * 2.4 + Math.random() * 0.5;
    const r = 50 + Math.sqrt(i) * 25 + Math.random() * 40;
    return {
      ...n,
      x: Math.cos(a) * r,
      y: Math.sin(a) * r * 0.6, // flatten for galaxy shape
      z: (Math.random() - 0.5) * 30,
      vx: 0, vy: 0,
      baseSize: 2 + Math.min(n.tags?.length || 0, 5) * 0.8,
      color: COLORS[n.category] || COLORS.other,
      pulse: Math.random() * Math.PI * 2,
    };
  });
  edges = data.edges;

  // Legend
  const cats = [...new Set(nodes.map(n => n.category))].sort();
  document.getElementById('legend').innerHTML = cats.map(c =>
    `<span><span class="dot" style="background:${COLORS[c]||'#555'}"></span>${c}</span>`
  ).join('');
  document.getElementById('stats').textContent =
    `${nodes.length} learnings · ${edges.length} connections · ${cats.length} domains`;

  // Simple force simulation
  for (let iter = 0; iter < 100; iter++) {
    for (const e of edges) {
      const s = nodes[e.source], t = nodes[e.target];
      if (!s || !t) continue;
      const dx = t.x - s.x, dy = t.y - s.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - 80) * 0.002;
      s.vx += dx/d * f; s.vy += dy/d * f;
      t.vx -= dx/d * f; t.vy -= dy/d * f;
    }
    for (const n of nodes) {
      n.x += n.vx; n.y += n.vy;
      n.vx *= 0.9; n.vy *= 0.9;
    }
  }
}

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);

  angle += 0.001;
  const cos = Math.cos(angle), sin = Math.sin(angle);

  // Project 3D → 2D with rotation
  const projected = nodes.map(n => {
    const rx = n.x * cos - n.z * sin;
    const rz = n.x * sin + n.z * cos;
    const scale = 600 / (600 + rz) * zoom;
    return {
      sx: W/2 + rx * scale,
      sy: H/2 + n.y * scale,
      scale,
      node: n,
    };
  });

  // Draw edges
  ctx.lineWidth = 0.3;
  for (const e of edges) {
    const s = projected[e.source], t = projected[e.target];
    if (!s || !t) continue;
    ctx.strokeStyle = `rgba(255,255,255,0.04)`;
    ctx.beginPath();
    ctx.moveTo(s.sx, s.sy);
    ctx.lineTo(t.sx, t.sy);
    ctx.stroke();
  }

  // Find hovered
  hovered = null;
  let minDist = 20;
  for (const p of projected) {
    const dx = mouse.x - p.sx, dy = mouse.y - p.sy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < minDist) { minDist = d; hovered = p; }
  }

  // Draw nodes (stars)
  for (const p of projected) {
    const n = p.node;
    n.pulse += 0.02;
    const pulse = 1 + Math.sin(n.pulse) * 0.3;
    const size = n.baseSize * p.scale * pulse;
    const isHovered = hovered === p;

    // Glow
    if (isHovered || size > 3) {
      const grad = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, size * (isHovered ? 8 : 4));
      grad.addColorStop(0, n.color + (isHovered ? '80' : '30'));
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, size * (isHovered ? 8 : 4), 0, Math.PI * 2);
      ctx.fill();
    }

    // Star
    ctx.fillStyle = isHovered ? '#fff' : n.color;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, isHovered ? size * 2 : size, 0, Math.PI * 2);
    ctx.fill();

    // Connected edges glow on hover
    if (isHovered) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = n.color + '60';
      for (const e of edges) {
        if (e.source === n.id || e.target === n.id) {
          const other = projected[e.source === n.id ? e.target : e.source];
          if (!other) continue;
          ctx.beginPath();
          ctx.moveTo(p.sx, p.sy);
          ctx.lineTo(other.sx, other.sy);
          ctx.stroke();
        }
      }
    }
  }

  // Tooltip
  const tip = document.getElementById('tooltip');
  if (hovered) {
    const n = hovered.node;
    tip.style.display = 'block';
    tip.style.left = (mouse.x + 15) + 'px';
    tip.style.top = (mouse.y - 10) + 'px';
    tip.querySelector('.title').textContent = n.name;
    tip.querySelector('.cat').textContent = n.category;
    tip.querySelector('.tags').textContent = (n.tags || []).join(', ');
  } else {
    tip.style.display = 'none';
  }

  requestAnimationFrame(draw);
}

load().then(() => { draw(); });
</script>
</body>
</html>
