<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Oracle Knowledge Galaxy</title>
<style>
*{margin:0;padding:0}body{background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace}
#info{position:fixed;top:20px;left:20px;color:#00f0ff;font-size:14px;text-shadow:0 0 10px rgba(0,240,255,0.5);z-index:10}
#info h1{font-size:20px;margin-bottom:5px}
#info .stats{color:#555;font-size:11px}
.embedded #info{display:none}
#tooltip{position:fixed;display:none;background:rgba(10,14,23,0.95);border:1px solid #00f0ff;border-radius:8px;padding:10px 14px;color:#e0e0e0;font-size:11px;max-width:300px;box-shadow:0 0 20px rgba(0,240,255,0.2);pointer-events:none;z-index:20}
#tooltip .t{color:#00f0ff;font-weight:700;margin-bottom:4px}
#tooltip .c{color:#888;font-size:10px}
</style>
</head><body>
<div id="info"><h1>Oracle Knowledge Galaxy</h1><div class="stats" id="stats">Loading...</div></div>
<div id="tooltip"><div class="t"></div><div class="c"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLORS={deploy:0xff6b6b,testing:0xffa726,security:0xff4444,social:0x42a5f5,automation:0x66bb6a,workflow:0xab47bc,database:0xffca28,consciousness:0x00f0ff,communication:0xe91e63,cloudflare:0xff9800,other:0x8888aa};

let scene,camera,renderer,mainStars,dustParticles,starData=[];
const mouse=new THREE.Vector2(-999,-999);
const raycaster=new THREE.Raycaster();
raycaster.params.Points.threshold=5;

function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,5000);
  camera.position.z=350;
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  let isDragging=false,prevX=0,prevY=0;
  addEventListener('mousemove',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    if(isDragging){
      scene.rotation.y+=(e.clientX-prevX)*0.005;
      scene.rotation.x+=(e.clientY-prevY)*0.005;
      prevX=e.clientX;prevY=e.clientY;
    }
  });
  addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY});
  addEventListener('mouseup',()=>isDragging=false);
  addEventListener('wheel',e=>{camera.position.z=Math.max(150,Math.min(800,camera.position.z+e.deltaY*0.5))});
}

async function loadData(){
  const res=await fetch('/stars-data');
  const data=await res.json();
  const nodes=data.nodes;
  const cats=[...new Set(nodes.map(n=>n.category))];

  // Category positions (spiral)
  const catPos={};
  cats.forEach((c,i)=>{
    const a=i/cats.length*Math.PI*2;
    const r=120;
    catPos[c]={x:Math.cos(a)*r,y:Math.sin(a)*r,color:COLORS[c]||0x888888};
  });

  // Main stars geometry
  const mainGeo=new THREE.BufferGeometry();
  const mainPositions=[],mainColors=[],mainSizes=[];

  nodes.forEach((n,i)=>{
    const cp=catPos[n.category]||{x:0,y:0,color:0x888888};
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*80;
    const x=cp.x+Math.cos(a)*r;
    const y=cp.y+Math.sin(a)*r;
    const z=(Math.random()-0.5)*60;
    mainPositions.push(x,y,z);
    const col=new THREE.Color(cp.color);
    mainColors.push(col.r,col.g,col.b);
    mainSizes.push(5+Math.random()*8+(n.tags?.length||0)*2);
    starData.push({name:n.name,category:n.category,tags:n.tags||[],idx:i});
  });

  mainGeo.setAttribute('position',new THREE.Float32BufferAttribute(mainPositions,3));
  mainGeo.setAttribute('color',new THREE.Float32BufferAttribute(mainColors,3));
  mainGeo.setAttribute('size',new THREE.Float32BufferAttribute(mainSizes,1));

  // Star shader — glowing points
  const starMat=new THREE.ShaderMaterial({
    uniforms:{time:{value:0}},
    vertexShader:`
      attribute float size;
      varying vec3 vColor;
      uniform float time;
      void main(){
        vColor=color;
        vec4 mvPosition=modelViewMatrix*vec4(position,1.0);
        float pulse=1.0+0.4*sin(time*2.0+position.x*0.1+position.y*0.15);
        // Random bright flash for "learning" events
        float flash=step(0.997,fract(sin(dot(position.xy,vec2(12.9898,78.233))+time*0.5)*43758.5453));
        pulse+=flash*3.0;
        gl_PointSize=size*pulse*(300.0/-mvPosition.z);
        gl_Position=projectionMatrix*mvPosition;
      }
    `,
    fragmentShader:`
      varying vec3 vColor;
      void main(){
        float d=length(gl_PointCoord-vec2(0.5));
        if(d>0.5)discard;
        float glow=exp(-d*4.0);
        float core=exp(-d*12.0);
        vec3 col=vColor*glow+vec3(1.0)*core*0.8;
        float alpha=glow*0.9;
        gl_FragColor=vec4(col,alpha);
      }
    `,
    transparent:true,
    vertexColors:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
  });

  mainStars=new THREE.Points(mainGeo,starMat);
  scene.add(mainStars);

  // Dust particles (20000)
  const dustGeo=new THREE.BufferGeometry();
  const dustPos=[],dustCol=[],dustSiz=[];
  for(let i=0;i<20000;i++){
    const cat=cats[Math.floor(Math.random()*cats.length)];
    const cp=catPos[cat];
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*200;
    dustPos.push(
      cp.x+Math.cos(a)*r+(Math.random()-0.5)*40,
      cp.y+Math.sin(a)*r+(Math.random()-0.5)*40,
      (Math.random()-0.5)*80
    );
    const col=new THREE.Color(cp.color);
    dustCol.push(col.r,col.g,col.b);
    dustSiz.push(0.5+Math.random()*2.5);
  }
  // Center blend dust
  for(let i=0;i<5000;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*180;
    const cat=cats[Math.floor(Math.random()*cats.length)];
    const col=new THREE.Color(COLORS[cat]||0x888888);
    dustPos.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-0.5)*50);
    dustCol.push(col.r,col.g,col.b);
    dustSiz.push(0.4+Math.random()*1.5);
  }
  // Background
  for(let i=0;i<2000;i++){
    dustPos.push((Math.random()-0.5)*1500,(Math.random()-0.5)*1000,(Math.random()-0.5)*500);
    dustCol.push(1,1,1);
    dustSiz.push(0.2+Math.random()*0.6);
  }

  dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
  dustGeo.setAttribute('color',new THREE.Float32BufferAttribute(dustCol,3));
  dustGeo.setAttribute('size',new THREE.Float32BufferAttribute(dustSiz,1));

  const dustMat=new THREE.ShaderMaterial({
    vertexShader:`
      attribute float size;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        vColor=color;
        vec4 mvPosition=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=size*(200.0/-mvPosition.z);
        vAlpha=clamp(1.0-length(mvPosition.xyz)/800.0,0.05,0.7);
        gl_Position=projectionMatrix*mvPosition;
      }
    `,
    fragmentShader:`
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        float d=length(gl_PointCoord-vec2(0.5));
        if(d>0.5)discard;
        float a=exp(-d*6.0)*vAlpha;
        gl_FragColor=vec4(vColor,a);
      }
    `,
    transparent:true,
    vertexColors:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
  });

  dustParticles=new THREE.Points(dustGeo,dustMat);
  scene.add(dustParticles);

  document.getElementById('stats').textContent=`${nodes.length} learnings · 27000 particles · ${cats.length} domains`;
}

function animate(){
  requestAnimationFrame(animate);
  const t=performance.now()*0.001;

  // No auto rotation — user drags to rotate

  if(mainStars)mainStars.material.uniforms.time.value=t;

  // Tooltip
  raycaster.setFromCamera(mouse,camera);
  const tip=document.getElementById('tooltip');
  if(mainStars){
    const intersects=raycaster.intersectObject(mainStars);
    if(intersects.length>0){
      const idx=intersects[0].index;
      const s=starData[idx];
      if(s){
        tip.style.display='block';
        tip.style.left=((mouse.x+1)/2*innerWidth+15)+'px';
        tip.style.top=((-mouse.y+1)/2*innerHeight-10)+'px';
        tip.querySelector('.t').textContent=s.name;
        tip.querySelector('.c').textContent=s.category+' · '+(s.tags||[]).join(', ');
      }
    }else{tip.style.display='none';}
  }

  renderer.render(scene,camera);
}

if(window.self!==window.top)document.body.classList.add('embedded');
init();
loadData().then(animate);
</script></body></html>
