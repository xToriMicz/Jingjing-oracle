<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Oracle Knowledge Galaxy</title>
<script src="https://unpkg.com/@cosmograph/cosmograph@2.2.1/dist/index.umd.js"></script>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace}
#container{width:100vw;height:100vh}
#info{position:fixed;top:20px;left:20px;color:#00f0ff;font-size:14px;text-shadow:0 0 10px rgba(0,240,255,0.5);z-index:10}
#info h1{font-size:20px;margin-bottom:5px}
#info .stats{color:#555;font-size:11px}
</style>
</head><body>
<div id="info">
  <h1>Oracle Knowledge Galaxy</h1>
  <div class="stats" id="stats">Loading...</div>
</div>
<div id="container"></div>
<script>
const COLORS={deploy:'#ff6b6b',testing:'#ffa726',security:'#ff4444',social:'#42a5f5',automation:'#66bb6a',workflow:'#ab47bc',database:'#ffca28',consciousness:'#00f0ff',communication:'#e91e63',cloudflare:'#ff9800',other:'#556677'};

fetch('/stars-data').then(r=>r.json()).then(data=>{
  const nodes=data.nodes.map(n=>({
    id:String(n.id),
    label:n.name||n.file,
    color:COLORS[n.category]||COLORS.other,
    size:1+(n.tags?.length||0)*0.5,
  }));
  const links=data.edges.map(e=>({source:String(e.source),target:String(e.target)}));

  document.getElementById('stats').textContent=`${nodes.length} learnings · ${links.length} connections · WebGL`;

  const container=document.getElementById('container');
  const cosmo=new window.Cosmograph.Cosmograph(container,{
    nodes,links,
    nodeColor:n=>n.color,
    nodeSize:n=>n.size,
    linkColor:()=>'rgba(255,255,255,0.02)',
    linkWidth:0.1,
    backgroundColor:'#000000',
    spaceSize:4096,
    simulation:{repulsion:0.5,gravity:0.25,linkSpring:0.3,linkDistance:10,friction:0.85},
    renderLinks:true,
    nodeLabelAccessor:n=>n.label,
    nodeLabelColor:'#ffffff44',
    hoveredNodeRingColor:'#ffffff',
  });
});
</script>
</body></html>
