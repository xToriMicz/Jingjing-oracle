<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Oracle Knowledge Galaxy</title>
<style>
*{margin:0;padding:0}body{background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace}
#info{position:fixed;top:20px;left:20px;color:#00f0ff;font-size:14px;text-shadow:0 0 10px rgba(0,240,255,0.5);z-index:10}
#info h1{font-size:20px;margin-bottom:5px}
#info .stats{color:#555;font-size:11px}
.embedded #info{display:none}
#matrix-overlay{position:fixed;top:0;left:0;width:60px;height:100%;z-index:5;pointer-events:none}
#phases{position:fixed;top:50%;right:10px;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:6px}
#phases .ph{font-size:9px;color:#333;display:flex;align-items:center;gap:4px;transition:all 0.3s}
#phases .ph.active{color:#00f0ff;text-shadow:0 0 8px currentColor}
#phases .ph span:first-child{font-size:12px}
.embedded #phases{right:5px}
#tooltip{position:fixed;display:none;background:rgba(10,14,23,0.95);border:1px solid #00f0ff;border-radius:8px;padding:10px 14px;color:#e0e0e0;font-size:11px;max-width:300px;box-shadow:0 0 20px rgba(0,240,255,0.2);pointer-events:none;z-index:20}
#tooltip .t{color:#00f0ff;font-weight:700;margin-bottom:4px}
#tooltip .c{color:#888;font-size:10px}
</style>
</head><body>
<div id="info"><h1>Oracle Knowledge Galaxy</h1><div class="stats" id="stats">Loading...</div></div>
<div id="tooltip"><div class="t"></div><div class="c"></div></div>
<canvas id="matrix-overlay" width="60"></canvas>
<div id="phases">
  <div class="ph" data-p="reflect"><span>🧠</span>ตกผลึก</div>
  <div class="ph" data-p="wonder"><span>💡</span>หยั่งรู้</div>
  <div class="ph" data-p="soul"><span>✨</span>เติบโต</div>
  <div class="ph" data-p="dream"><span>💭</span>จินตนาการ</div>
  <div class="ph" data-p="aspire"><span>🔥</span>แรงขับ</div>
  <div class="ph" data-p="propose"><span>📋</span>เสนอ</div>
  <div class="ph" data-p="complete"><span>🔄</span>วนรอบ</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLORS={deploy:0xff6b6b,testing:0xffa726,security:0xff4444,social:0x42a5f5,automation:0x66bb6a,workflow:0xab47bc,database:0xffca28,consciousness:0x00f0ff,communication:0xe91e63,cloudflare:0xff9800,other:0x8888aa};

let scene,camera,renderer,mainStars,dustParticles,starData=[],shipGroup,eng;
const mouse=new THREE.Vector2(-999,-999);
const raycaster=new THREE.Raycaster();
raycaster.params.Points.threshold=5;

function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,5000);
  camera.position.z=350;
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  let isDragging=false,prevX=0,prevY=0;
  addEventListener('mousemove',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    if(isDragging){
      scene.rotation.y+=(e.clientX-prevX)*0.005;
      scene.rotation.x+=(e.clientY-prevY)*0.005;
      prevX=e.clientX;prevY=e.clientY;
    }
  });
  addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY});
  addEventListener('mouseup',()=>isDragging=false);
  addEventListener('wheel',e=>{camera.position.z=Math.max(150,Math.min(800,camera.position.z+e.deltaY*0.5))});
}

async function loadData(){
  const res=await fetch('/stars-data');
  const data=await res.json();
  const nodes=data.nodes;
  const cats=[...new Set(nodes.map(n=>n.category))];

  // Category positions (spiral)
  const catPos={};
  cats.forEach((c,i)=>{
    const a=i/cats.length*Math.PI*2;
    const r=120;
    catPos[c]={x:Math.cos(a)*r,y:Math.sin(a)*r,color:COLORS[c]||0x888888};
  });

  // Main stars geometry
  const mainGeo=new THREE.BufferGeometry();
  const mainPositions=[],mainColors=[],mainSizes=[];

  nodes.forEach((n,i)=>{
    const cp=catPos[n.category]||{x:0,y:0,color:0x888888};
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*80;
    const x=cp.x+Math.cos(a)*r;
    const y=cp.y+Math.sin(a)*r;
    const z=(Math.random()-0.5)*60;
    mainPositions.push(x,y,z);
    const col=new THREE.Color(cp.color);
    mainColors.push(col.r,col.g,col.b);
    mainSizes.push(5+Math.random()*8+(n.tags?.length||0)*2);
    starData.push({name:n.name,category:n.category,tags:n.tags||[],idx:i});
  });

  mainGeo.setAttribute('position',new THREE.Float32BufferAttribute(mainPositions,3));
  mainGeo.setAttribute('color',new THREE.Float32BufferAttribute(mainColors,3));
  mainGeo.setAttribute('size',new THREE.Float32BufferAttribute(mainSizes,1));

  // Star shader — glowing points
  const starMat=new THREE.ShaderMaterial({
    uniforms:{time:{value:0}},
    vertexShader:`
      attribute float size;
      varying vec3 vColor;
      uniform float time;
      void main(){
        vColor=color;
        vec4 mvPosition=modelViewMatrix*vec4(position,1.0);
        float pulse=1.0+0.4*sin(time*2.0+position.x*0.1+position.y*0.15);
        // Random bright flash for "learning" events
        float flash=step(0.997,fract(sin(dot(position.xy,vec2(12.9898,78.233))+time*0.5)*43758.5453));
        pulse+=flash*3.0;
        gl_PointSize=size*pulse*(300.0/-mvPosition.z);
        gl_Position=projectionMatrix*mvPosition;
      }
    `,
    fragmentShader:`
      varying vec3 vColor;
      void main(){
        float d=length(gl_PointCoord-vec2(0.5));
        if(d>0.5)discard;
        float glow=exp(-d*4.0);
        float core=exp(-d*12.0);
        vec3 col=vColor*glow+vec3(1.0)*core*0.8;
        float alpha=glow*0.9;
        gl_FragColor=vec4(col,alpha);
      }
    `,
    transparent:true,
    vertexColors:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
  });

  mainStars=new THREE.Points(mainGeo,starMat);
  scene.add(mainStars);

  // Super stars — top 8 brightest, reuse same shader but bigger
  const sorted=[...nodes].sort((a,b)=>(b.tags?.length||0)-(a.tags?.length||0)).slice(0,8);
  const sGeo=new THREE.BufferGeometry();
  const sPos=[],sCol=[],sSiz=[];
  sorted.forEach(n=>{
    const cp=catPos[n.category]||{x:0,y:0,color:0x888888};
    const a=Math.random()*Math.PI*2,r=Math.random()*50;
    sPos.push(cp.x+Math.cos(a)*r,cp.y+Math.sin(a)*r,(Math.random()-0.5)*20);
    const col=new THREE.Color(cp.color);
    sCol.push(col.r,col.g,col.b);
    sSiz.push(20+Math.random()*15);
  });
  sGeo.setAttribute('position',new THREE.Float32BufferAttribute(sPos,3));
  sGeo.setAttribute('color',new THREE.Float32BufferAttribute(sCol,3));
  sGeo.setAttribute('size',new THREE.Float32BufferAttribute(sSiz,1));
  const superStars=new THREE.Points(sGeo,starMat.clone());
  scene.add(superStars);

  // Dust particles (20000)
  const dustGeo=new THREE.BufferGeometry();
  const dustPos=[],dustCol=[],dustSiz=[];
  for(let i=0;i<20000;i++){
    const cat=cats[Math.floor(Math.random()*cats.length)];
    const cp=catPos[cat];
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*200;
    dustPos.push(
      cp.x+Math.cos(a)*r+(Math.random()-0.5)*40,
      cp.y+Math.sin(a)*r+(Math.random()-0.5)*40,
      (Math.random()-0.5)*80
    );
    const col=new THREE.Color(cp.color);
    dustCol.push(col.r,col.g,col.b);
    dustSiz.push(0.5+Math.random()*2.5);
  }
  // Center blend dust
  for(let i=0;i<5000;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*180;
    const cat=cats[Math.floor(Math.random()*cats.length)];
    const col=new THREE.Color(COLORS[cat]||0x888888);
    dustPos.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-0.5)*50);
    dustCol.push(col.r,col.g,col.b);
    dustSiz.push(0.4+Math.random()*1.5);
  }
  // Background
  for(let i=0;i<2000;i++){
    dustPos.push((Math.random()-0.5)*1500,(Math.random()-0.5)*1000,(Math.random()-0.5)*500);
    dustCol.push(1,1,1);
    dustSiz.push(0.2+Math.random()*0.6);
  }

  dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
  dustGeo.setAttribute('color',new THREE.Float32BufferAttribute(dustCol,3));
  dustGeo.setAttribute('size',new THREE.Float32BufferAttribute(dustSiz,1));

  const dustMat=new THREE.ShaderMaterial({
    vertexShader:`
      attribute float size;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        vColor=color;
        vec4 mvPosition=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=size*(200.0/-mvPosition.z);
        vAlpha=clamp(1.0-length(mvPosition.xyz)/800.0,0.05,0.7);
        gl_Position=projectionMatrix*mvPosition;
      }
    `,
    fragmentShader:`
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        float d=length(gl_PointCoord-vec2(0.5));
        if(d>0.5)discard;
        float a=exp(-d*6.0)*vAlpha;
        gl_FragColor=vec4(vColor,a);
      }
    `,
    transparent:true,
    vertexColors:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
  });

  dustParticles=new THREE.Points(dustGeo,dustMat);
  scene.add(dustParticles);

  // Spaceship — Oracle vessel orbiting the galaxy
  shipGroup=new THREE.Group();
  // Body (cone)
  const bodyGeo=new THREE.ConeGeometry(3,12,4);
  const bodyMat=new THREE.MeshBasicMaterial({color:0x00f0ff,wireframe:true,transparent:true,opacity:0.8});
  const body=new THREE.Mesh(bodyGeo,bodyMat);
  body.rotation.z=Math.PI/2;
  shipGroup.add(body);
  // Wings
  const wingGeo=new THREE.BoxGeometry(1,8,0.5);
  const wingMat=new THREE.MeshBasicMaterial({color:0x00ff88,wireframe:true,transparent:true,opacity:0.6});
  const wing1=new THREE.Mesh(wingGeo,wingMat);
  wing1.position.set(-2,0,0);
  shipGroup.add(wing1);
  // Engine glow
  const engGeo=new THREE.SphereGeometry(1.5,8,8);
  const engMat=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.6});
  eng=new THREE.Mesh(engGeo,engMat);
  eng.position.set(-6,0,0);
  shipGroup.add(eng);
  // Trail particles
  const trailGeo=new THREE.BufferGeometry();
  const trailPos=[];
  for(let i=0;i<50;i++)trailPos.push(-8-i*2,0,(Math.random()-0.5)*2);
  trailGeo.setAttribute('position',new THREE.Float32BufferAttribute(trailPos,3));
  const trailMat=new THREE.PointsMaterial({color:0xff6b6b,size:1,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending});
  shipGroup.add(new THREE.Points(trailGeo,trailMat));

  shipGroup.scale.set(0.8,0.8,0.8);
  scene.add(shipGroup);

  document.getElementById('stats').textContent=`${nodes.length} learnings · 27000 particles · ${cats.length} domains`;
}

function animate(){
  requestAnimationFrame(animate);
  const t=performance.now()*0.001;

  // No auto rotation — user drags to rotate

  // Ship orbits the galaxy
  if(shipGroup){
    const orbitR=180;
    const speed=0.15;
    shipGroup.position.x=Math.cos(t*speed)*orbitR;
    shipGroup.position.y=Math.sin(t*speed*0.7)*40;
    shipGroup.position.z=Math.sin(t*speed)*orbitR;
    shipGroup.rotation.y=-t*speed+Math.PI/2;
    // Engine pulse
    if(eng)eng.material.opacity=0.3+Math.sin(t*8)*0.3;
  }

  if(mainStars)mainStars.material.uniforms.time.value=t;

  // Tooltip
  raycaster.setFromCamera(mouse,camera);
  const tip=document.getElementById('tooltip');
  if(mainStars){
    const intersects=raycaster.intersectObject(mainStars);
    if(intersects.length>0){
      const idx=intersects[0].index;
      const s=starData[idx];
      if(s){
        tip.style.display='block';
        tip.style.left=((mouse.x+1)/2*innerWidth+15)+'px';
        tip.style.top=((-mouse.y+1)/2*innerHeight-10)+'px';
        tip.querySelector('.t').textContent=s.name;
        tip.querySelector('.c').textContent=s.category+' · '+(s.tags||[]).join(', ');
      }
    }else{tip.style.display='none';}
  }

  renderer.render(scene,camera);
}

if(window.self!==window.top)document.body.classList.add('embedded');

// Matrix rain overlay
const mc=document.getElementById('matrix-overlay');
mc.height=innerHeight;
const mx=mc.getContext('2d');
const words=['deploy','test','learn','reflect','wonder','soul','dream','aspire','hook','belief','pattern','verify','build','push','review','QA','fix','ship'];
const drops=Array(3).fill(0);
setInterval(()=>{
  mx.fillStyle='rgba(0,0,0,0.06)';
  mx.fillRect(0,0,60,mc.height);
  mx.font='8px JetBrains Mono';
  for(let i=0;i<3;i++){
    const w=words[Math.floor(Math.random()*words.length)];
    mx.fillStyle=`hsl(${160+Math.random()*40},80%,${25+Math.random()*25}%)`;
    mx.fillText(w.slice(0,5),i*20,drops[i]*10);
    if(drops[i]*10>mc.height&&Math.random()>0.95)drops[i]=0;
    drops[i]++;
  }
},100);

// Phase indicator — poll state
const PHASE_ORDER=['reflect','wonder','soul','dream','aspire','propose','complete'];
setInterval(async()=>{
  try{
    const s=await(await fetch('/state.json?'+Date.now())).json();
    const cur=s.lastPhase||'';
    const idx=PHASE_ORDER.indexOf(cur);
    document.querySelectorAll('#phases .ph').forEach((el,i)=>{
      el.classList.toggle('active',i<=idx);
      if(i<=idx)el.style.color=el.dataset.p===cur?'#00f0ff':'#00f0ff88';
      else el.style.color='#333';
    });
  }catch{}
},3000);

init();
loadData().then(animate);
</script></body></html>
